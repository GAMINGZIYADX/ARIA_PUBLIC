<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARIA · Unlock</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='aria_icon.svg') }}">
  <style>
    :root {
      --bg: #0d0d0f; --surface: #141416; --surface-2: #1a1a1f;
      --accent: #6c63ff; --accent-hover: #7d75ff;
      --text: #f0f0f2; --text-muted: #8a8a96; --text-faint: #5d5d68;
      --border: rgba(255,255,255,0.07); --border-strong: rgba(255,255,255,0.12);
      --err: #e5675f;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      display: grid;
      place-items: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 30px 30px;
      text-align: center;
    }
    .mark {
      width: 52px; height: 52px;
      margin: 0 auto 18px;
      display: grid; place-items: center;
      color: var(--accent);
    }
    h1 { font-size: 19px; font-weight: 500; letter-spacing: 0.02em; }
    .sub {
      font-size: 13px; color: var(--text-muted);
      margin-top: 6px; margin-bottom: 26px;
    }
    form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
    label {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.12em;
      color: var(--text-faint);
    }
    input[type="password"] {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 13px;
      font-family: var(--font);
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="password"]:focus { border-color: var(--accent); }
    input[type="password"]::placeholder { color: var(--text-faint); }
    button {
      margin-top: 6px;
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: var(--accent-hover); }
    .login-error {
      margin-top: 14px;
      padding: 9px 12px;
      border: 1px solid rgba(229,103,95,0.3);
      background: rgba(229,103,95,0.08);
      border-radius: 8px;
      color: var(--err);
      font-size: 12.5px;
      text-align: center;
    }
    .foot {
      margin-top: 22px;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.08em;
      color: var(--text-faint);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <rect x="4" y="4" width="16" height="16" rx="5"/>
        <circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <h1>ARIA</h1>
    <p class="sub">Local voice assistant — locked</p>

    <form method="post" action="{{ url_for('login') }}" autocomplete="off">
      <label for="password">PASSPHRASE</label>
      <input type="password" id="password" name="password" placeholder="Enter passphrase" autocomplete="current-password" autofocus>
      <button type="submit">Unlock</button>
    </form>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <div class="foot">RUNNING ON-DEVICE · NO CLOUD</div>
  </div>
</body>
</html>
